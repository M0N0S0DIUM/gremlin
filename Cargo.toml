[package]
name = "gremlin"
version = "0.1.0"
edition = "2024"
description = "Local-first AI orchestration daemon for Linux desktops"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
libc = "0.2"
base64 = "0.22"
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "vtab", "functions", "load_extension"] }
# candle-core = { version = "0.6", features = [] }
# tokenizers = "0.15"
# half = "2"

# sprite-viewer binary (Wayland window for floating sprite)
winit = "0.30"
wgpu = "22"
pollster = "0.3"
rand = "0.8"

[[bin]]
name = "gremlin"
path = "src/main.rs"

[[bin]]
name = "sprite-viewer"
path = "src/bin/sprite-viewer.rs"