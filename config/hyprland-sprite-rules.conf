# Hyprland window rules for Gremlin sprite viewer
# Add these to ~/.config/hypr/hyprland.conf
#
# The sprite-viewer binary sets its Wayland app_id to "gremlin-sprite" —
# these rules match on that class and make the window borderless, floating,
# unfocusable, and pinned to the bottom-right corner at 4x scale (192×192).

windowrulev2 = float, class:^(gremlin-sprite)$
windowrulev2 = noborder, class:^(gremlin-sprite)$
windowrulev2 = noblur, class:^(gremlin-sprite)$
windowrulev2 = noshadow, class:^(gremlin-sprite)$
windowrulev2 = noinitialfocus, class:^(gremlin-sprite)$
windowrulev2 = keepaspectratio, class:^(gremlin-sprite)$
windowrulev2 = size 192 192, class:^(gremlin-sprite)$
windowrulev2 = move 85% 75%, class:^(gremlin-sprite)$
windowrulev2 = pin, class:^(gremlin-sprite)$
